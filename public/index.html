<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pánico</title>
</head>
<body style="text-align:center; font-family:sans-serif;">

<h1>🚨 PÁNICO</h1>

<button onclick="sendPanico()" style="font-size:30px; padding:20px; background:red; color:white; border:none; border-radius:10px; cursor:pointer;">
  ACTIVAR
</button>

<script>
async function sendPanico() {
  if (!navigator.geolocation) {
    alert("Geolocalización no soportada");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      try {
        const response = await fetch("https://n8n.securitysac.com/webhook/panico", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            timestamp: new Date().toISOString()
          })
        });

        if (response.ok) {
          alert("🚨 Pánico enviado con éxito");
        } else {
          alert("Error de servidor n8n: " + response.statusText);
        }
      } catch (error) {
        console.error("Error Fetch/CORS:", error);
        alert("Error de red o bloqueo CORS al conectar con n8n");
      }
    },
    (err) => {
      alert("Error al obtener GPS: " + err.message);
    },
    { enableHighAccuracy: true }
  );
}
</script>

</body>
</html>
