<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pánico</title>
</head>
<body style="text-align:center; font-family:sans-serif;">

<h1>🚨 PÁNICO</h1>

<button onclick="sendPanico()" style="font-size:30px; padding:20px; background:red; color:white;">
  ACTIVAR
</button>

<script>
async function sendPanico() {
  if (!navigator.geolocation) {
    alert("Geolocalización no soportada");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      try {
        const response = await fetch("https://n8n.securitysac.com/webhook/panico", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            timestamp: new Date().toISOString()
          })
        });

        if (response.ok) {
          alert("🚨 Enviado con éxito");
        } else {
          alert("Error al enviar: " + response.statusText);
        }
      } catch (error) {
        console.error("Error en Fetch:", error);
        alert("Error de red/CORS");
      }
    },
    (err) => {
      alert("Error al obtener ubicación: " + err.message);
    },
    { enableHighAccuracy: true }
  );
}
</script>

</body>
</html>
